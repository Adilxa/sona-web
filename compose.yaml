name: sona-web
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SONA_SITE_ORIGIN: https://sona-ai.watch
      SONA_API_ORIGIN: ${SONA_API_ORIGIN:-https://sona.indicart.org}
      SONA_CATALOG_DEVICE_ID: ${SONA_CATALOG_DEVICE_ID:-}
      SONA_WEB_PRODUCT_IDS:
      SONA_OPERATOR_NAME: ${SONA_OPERATOR_NAME:-}
      SONA_SUPPORT_EMAIL: ${SONA_SUPPORT_EMAIL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/icon.svg').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      start_period: 15s
      timeout: 5s
      retries: 3
