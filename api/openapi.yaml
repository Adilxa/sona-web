openapi: 3.0.3
info:
  title: SONA Web API
  version: 0.1.0
security:
  - bearerAuth: []
paths:
  /v1/auth/guest:
    post:
      operationId: createGuest
      tags:
        - auth
      summary: Start (or resume) a guest session for a device.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/email/request:
    post:
      operationId: requestEmailCode
      tags:
        - auth
      summary: Send a 6-digit code to verify an email at registration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
      responses:
        '202':
          description: '202'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/AttestationRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/email/verify:
    post:
      operationId: verifyEmailCode
      tags:
        - auth
      summary: Complete registration with the emailed code and chosen password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeVerify'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/AccountBlocked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/email/login:
    post:
      operationId: signInWithPassword
      tags:
        - auth
      summary: Sign in with a registered email and password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLogin'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/series/{series_id}:
    get:
      operationId: getSeries
      tags:
        - catalog
      summary: Series card from the in-memory catalog (CT-03).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SeriesID'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesCard'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/series/{series_id}/episodes:
    get:
      operationId: listSeriesEpisodes
      tags:
        - catalog
      summary: Released episodes of a series with the locked flag.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SeriesID'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeList'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/episodes/{episode_id}/playback:
    get:
      operationId: getEpisodePlayback
      tags:
        - playback
      summary: Signed HLS URL of an episode (CT-08, hot path).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EpisodeID'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playback'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/LockedProblem'
          description: '403'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/episodes/{episode_id}/unlock:
    post:
      operationId: unlockEpisode
      tags:
        - access
      summary: Unlock a paid episode (AC-03, user, idempotent).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EpisodeID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlockResult'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: '402'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: '409'
        '422':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me/daily-free:
    get:
      operationId: getMyDailyFree
      tags:
        - me
      summary: Daily free unlocks left for the current user (AC-04).
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyFree'
          description: '200'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/checkin:
    get:
      operationId: getMyCheckin
      tags:
        - me
      summary: Recent check-ins and today's status (GM-02).
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinStatus'
          description: '200'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: checkIn
      tags:
        - me
      summary: Check in for today and claim the reward (GM-02).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinResult'
          description: '200'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/streak:
    get:
      operationId: getMyStreak
      tags:
        - me
      summary: Recorded watch streak and the next reward (GM-03).
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreakStatus'
          description: '200'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/push-token:
    put:
      operationId: putPushToken
      tags:
        - notifications
      summary: Register the push token of the calling device (NT-01).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenRequest'
      responses:
        '204':
          description: '204'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deletePushToken
      tags:
        - notifications
      summary: Remove the push token of the calling device (NT-01).
      security:
        - bearerAuth: []
      responses:
        '204':
          description: '204'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/notification-settings:
    get:
      operationId: getNotificationSettings
      tags:
        - notifications
      summary: Which push types the account receives (NT-01).
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
          description: '200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateNotificationSettings
      tags:
        - notifications
      summary: Turn push types on or off (NT-01).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettingsUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/refresh:
    post:
      operationId: refreshTokens
      tags:
        - auth
      summary: Rotate the token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      summary: Revoke the current session.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: '204'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me:
    get:
      operationId: getMe
      tags:
        - me
      summary: Profile of the current guest or user.
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: '200'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateMe
      tags:
        - me
      summary: Change the language and the account time zone (AU-08).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/TimezoneChangeTooSoon'
    delete:
      operationId: deleteMe
      tags:
        - me
      summary: Request deletion of the account (App Store 5.1.1(v), Google Play).
      security:
        - bearerAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionScheduled'
          description: '202'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/me/wallet:
    get:
      operationId: getMyWallet
      tags:
        - me
      summary: Coin balance of the current user (WL-01).
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
          description: '200'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/wallet/ledger:
    get:
      operationId: getMyWalletLedger
      tags:
        - me
      summary: Coin movement history, newest first (WL-02).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPage'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/devices:
    get:
      operationId: listMyDevices
      tags:
        - me
      summary: Devices with live sessions of the current user (AU-07).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/devices/{device_id}:
    delete:
      operationId: signOutDevice
      tags:
        - me
      summary: Sign out every session of one device (AU-07).
      security:
        - bearerAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: '204'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/products:
    get:
      operationId: listProducts
      tags:
        - billing
      summary: Coin packages for sale on a platform (PY-01).
      security: []
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum:
              - web
              - ios
              - android
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOfferList'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/payments/stripe/checkout:
    post:
      operationId: createStripeCheckout
      tags:
        - billing
      summary: Start a Stripe Checkout for a coin package (web, PY-02).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResult'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/progress:
    post:
      operationId: reportProgress
      tags:
        - progress
      summary: Report a watch position heartbeat (PB-01).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressReport'
      responses:
        '204':
          description: '204'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/me/continue-watching:
    get:
      operationId: continueWatching
      tags:
        - progress
      summary: Series to resume, most recent first (PB-03).
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinueWatching'
          description: '200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/series/{series_id}/like:
    put:
      operationId: likeSeries
      tags:
        - social
      summary: Like a series (SO-01, idempotent).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SeriesID'
      responses:
        '204':
          description: '204'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: unlikeSeries
      tags:
        - social
      summary: Remove a like (idempotent).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SeriesID'
      responses:
        '204':
          description: '204'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/series/{series_id}/favorite:
    put:
      operationId: favoriteSeries
      tags:
        - social
      summary: Save a series to favorites (SO-01, idempotent).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SeriesID'
      responses:
        '204':
          description: '204'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: unfavoriteSeries
      tags:
        - social
      summary: Remove a series from favorites (idempotent).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SeriesID'
      responses:
        '204':
          description: '204'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/favorites:
    get:
      operationId: listFavorites
      tags:
        - social
      summary: The current user's saved series, newest first (SO-01).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoritesPage'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/events:
    post:
      operationId: reportEvents
      tags:
        - events
      summary: Report a batch of client events (EV-01).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsAccepted'
          description: '202'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/feed:
    get:
      operationId: getFeed
      tags:
        - feed
      summary: The infinite recommendation feed (FD-02).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPage'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/catalog:
    get:
      operationId: browseCatalog
      tags:
        - catalog
      summary: Browse published series (FD-04).
      security:
        - bearerAuth: []
      parameters:
        - name: genre
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - new
              - popular
            default: new
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesBriefPage'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/search:
    get:
      operationId: searchSeries
      tags:
        - catalog
      summary: Fuzzy search series by title (FD-04).
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesBriefList'
          description: '200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/home:
    get:
      operationId: getHome
      tags:
        - feed
      summary: The home screen blocks (FD-03).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomePage'
          description: '200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  schemas:
    GuestRequest:
      type: object
      additionalProperties: false
      required:
        - device_id
        - platform
        - timezone
      properties:
        device_id:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        platform:
          type: string
          enum:
            - ios
            - android
            - web
        timezone:
          type: string
          minLength: 1
          maxLength: 64
    TokenPair:
      type: object
      additionalProperties: false
      required:
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_expires_at
        - user_id
        - role
      properties:
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        user_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/UserRole'
        deletion_cancelled:
          type: boolean
    UserRole:
